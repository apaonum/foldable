name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @foldablejs/core exec playwright install --with-deps webkit
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter @foldablejs/core test:node
      - run: pnpm --filter @foldablejs/core test:browser
      - run: pnpm --filter @foldablejs/vue test:node
      - run: pnpm --filter @foldablejs/vue test:browser
      # `...` builds the example's workspace deps (core, vue) first.
      - run: pnpm --filter example-nuxt... build
